name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: "This run is intended to produce a new Play Store release"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android version code increases from base
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release) }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          CURRENT_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\"')"
          CURRENT_CODE="${CURRENT_VERSION##*+}"
          if [[ ! "$CURRENT_CODE" =~ ^[0-9]+$ ]] || (( CURRENT_CODE <= 1 )); then
            echo "::error::pubspec.yaml must use a numeric Android build number greater than 1."
            exit 1
          fi
          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          BASE_VERSION="$(git show "$BASE_SHA:pubspec.yaml" | sed -n 's/^version: *//p' | tr -d '\"')"
          BASE_CODE="${BASE_VERSION##*+}"
          if [[ ! "$BASE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read a numeric base version code from pubspec.yaml."
            exit 1
          fi
          echo "Base version code: $BASE_CODE"
          echo "Candidate version code: $CURRENT_CODE"
          if (( CURRENT_CODE <= BASE_CODE )); then
            echo "::error::Version code must increase for each release candidate. Bump the +build number in pubspec.yaml."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons from the checked-in artwork
        run: dart run flutter_launcher_icons

      - name: Run Flutter unit tests
        run: flutter test

      - name: Run Dart static analysis (fail on warnings and errors)
        run: flutter analyze --no-fatal-infos

      - name: Configure Release Keystore from Repository Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (AAB) & APK
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation --dart-define=VIBESYNC_SUPPORT_URL=${{ vars.VIBESYNC_SUPPORT_URL }}
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=VIBESYNC_SUPPORT_URL=${{ vars.VIBESYNC_SUPPORT_URL }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
