name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons from the checked-in artwork
        run: dart run flutter_launcher_icons

      - name: Run Flutter unit tests
        run: flutter test

      - name: Run Dart static analysis
        run: flutter analyze

      - name: Configure Release Keystore from Repository Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android App Bundle (AAB) & APK
        run: |
          flutter build appbundle --release --android-skip-build-dependency-validation --dart-define=VIBESYNC_SUPPORT_URL=${{ vars.VIBESYNC_SUPPORT_URL }}
          flutter build apk --release --android-skip-build-dependency-validation --dart-define=VIBESYNC_SUPPORT_URL=${{ vars.VIBESYNC_SUPPORT_URL }}

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk
