name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release:
        description: "This run is intended to produce a new Play Store release"
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Android version code and name
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release) }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '"')"
          CURRENT_CODE="${CURRENT_VERSION##*+}"
          CURRENT_NAME="${CURRENT_VERSION%%+*}"
          ANDROID_CODE="$(awk '/^[[:space:]]*versionCode[[:space:]]+[0-9]+/ { print $2; exit }' android/app/build.gradle)"
          ANDROID_NAME="$(awk -F'"' '/^[[:space:]]*versionName[[:space:]]+"/ { print $2; exit }' android/app/build.gradle)"

          if [[ ! "$CURRENT_CODE" =~ ^[0-9]+$ ]] || (( CURRENT_CODE <= 1 )); then
            echo "::error::pubspec.yaml must use a numeric Android build number greater than 1."
            exit 1
          fi
          if [[ "$CURRENT_CODE" != "$ANDROID_CODE" || "$CURRENT_NAME" != "$ANDROID_NAME" ]]; then
            echo "::error::pubspec.yaml version and Android Gradle versionCode/versionName must match."
            exit 1
          fi

          if [[ -n "$PR_BASE_SHA" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ -n "$PUSH_BASE_SHA" && "$PUSH_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          else
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          BASE_VERSION="$(git show "$BASE_SHA:pubspec.yaml" | sed -n 's/^version: *//p' | tr -d '"')"
          BASE_CODE="${BASE_VERSION##*+}"
          if [[ ! "$BASE_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read a numeric base version code from pubspec.yaml."
            exit 1
          fi
          echo "Base version code: $BASE_CODE"
          echo "Candidate version code: $CURRENT_CODE"
          if (( CURRENT_CODE <= BASE_CODE )); then
            echo "::error::Version code must increase for each release candidate."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Run Flutter unit tests
        run: flutter test

      - name: Run Dart static analysis
        run: flutter analyze --no-fatal-infos

      - name: Configure Release Keystore from Repository Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Clean and build release artifacts
        env:
          VIBESYNC_SUPPORT_URL: ${{ vars.VIBESYNC_SUPPORT_URL }}
          COFFEE_SUPPORT_URL: ${{ vars.COFFEE_SUPPORT_URL }}
          ADMOB_REWARDED_ANDROID: ${{ vars.ADMOB_REWARDED_ANDROID }}
          ADMOB_REWARDED_IOS: ${{ vars.ADMOB_REWARDED_IOS }}
          ADMOB_INTERSTITIAL_ANDROID: ${{ vars.ADMOB_INTERSTITIAL_ANDROID }}
          ADMOB_INTERSTITIAL_IOS: ${{ vars.ADMOB_INTERSTITIAL_IOS }}
        run: |
          set -euo pipefail
          flutter clean
          flutter pub get
          BUILD_DEFINES=()
          if [[ -n "$VIBESYNC_SUPPORT_URL" ]]; then BUILD_DEFINES+=(--dart-define="VIBESYNC_SUPPORT_URL=$VIBESYNC_SUPPORT_URL"); fi
          if [[ -n "$COFFEE_SUPPORT_URL" ]]; then BUILD_DEFINES+=(--dart-define="COFFEE_SUPPORT_URL=$COFFEE_SUPPORT_URL"); fi
          if [[ -n "$ADMOB_REWARDED_ANDROID" ]]; then BUILD_DEFINES+=(--dart-define="ADMOB_REWARDED_ANDROID=$ADMOB_REWARDED_ANDROID"); fi
          if [[ -n "$ADMOB_REWARDED_IOS" ]]; then BUILD_DEFINES+=(--dart-define="ADMOB_REWARDED_IOS=$ADMOB_REWARDED_IOS"); fi
          if [[ -n "$ADMOB_INTERSTITIAL_ANDROID" ]]; then BUILD_DEFINES+=(--dart-define="ADMOB_INTERSTITIAL_ANDROID=$ADMOB_INTERSTITIAL_ANDROID"); fi
          if [[ -n "$ADMOB_INTERSTITIAL_IOS" ]]; then BUILD_DEFINES+=(--dart-define="ADMOB_INTERSTITIAL_IOS=$ADMOB_INTERSTITIAL_IOS"); fi
          flutter build appbundle --release "${BUILD_DEFINES[@]}"
          flutter build apk --release "${BUILD_DEFINES[@]}"

      - name: Verify 16 KB App Bundle alignment
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="build/app/outputs/bundle/release/app-release.aab"
          BUNDLETOOL_VERSION="1.18.3"
          curl --fail --silent --show-error --location             "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"             --output "${RUNNER_TEMP}/bundletool.jar"

          java -jar "${RUNNER_TEMP}/bundletool.jar" dump config --bundle="${BUNDLE}"             | tee "${RUNNER_TEMP}/bundle-config.txt"
          if ! grep -q "PAGE_ALIGNMENT_16K" "${RUNNER_TEMP}/bundle-config.txt"; then
            echo "::error::The AAB does not request PAGE_ALIGNMENT_16K."
            exit 1
          fi

      - name: Verify 16 KB APK ZIP and ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${SDK_ROOT}" || ! -d "${SDK_ROOT}/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory was not found."
            exit 1
          fi

          ZIPALIGN="$(find "${SDK_ROOT}/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)"
          if [[ -z "${ZIPALIGN}" ]]; then
            echo "::error::zipalign was not found in the Android SDK."
            exit 1
          fi
          "${ZIPALIGN}" -c -P 16 -v 4 "${APK}"

          EXTRACT_DIR="$(mktemp -d)"
          trap 'rm -rf "${EXTRACT_DIR}"' EXIT
          unzip -q "${APK}" -d "${EXTRACT_DIR}"

          python3 - "${EXTRACT_DIR}" <<'PY'
          import glob
          import os
          import subprocess
          import sys

          root = sys.argv[1]
          libraries = []
          for abi in ("arm64-v8a", "x86_64"):
              libraries.extend(glob.glob(os.path.join(root, "lib", abi, "*.so")))

          if not libraries:
              print("ERROR: No arm64-v8a or x86_64 native libraries found in APK.", file=sys.stderr)
              sys.exit(1)

          failures = []
          segments_checked = 0
          for library in sorted(libraries):
              output = subprocess.check_output(["readelf", "-lW", library], text=True)
              load_segments = [
                  line.split() for line in output.splitlines()
                  if line.split() and line.split()[0] == "LOAD"
              ]
              if not load_segments:
                  failures.append(f"{library}: no ELF LOAD segments were parsed")
                  continue

              for fields in load_segments:
                  alignment = int(fields[-1], 16)
                  segments_checked += 1
                  if alignment < 0x4000 or alignment % 0x4000 != 0:
                      failures.append(
                          f"{library}: LOAD alignment {alignment:#x} is below/not a multiple of 0x4000"
                      )

          if failures:
              print("16 KB ELF alignment check failed:", file=sys.stderr)
              for failure in failures:
                  print(f" - {failure}", file=sys.stderr)
              sys.exit(1)

          print(f"PASS: {len(libraries)} 64-bit native libraries, {segments_checked} LOAD segments aligned for 16 KB pages.")
          PY

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/bundle/release/*.aab
            build/app/outputs/flutter-apk/*.apk

  dashboard-check:
    name: Type-check and build React/Vite dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dashboard dependencies
        run: bun install --frozen-lockfile

      - name: Type-check dashboard
        run: bun run lint

      - name: Build dashboard
        run: bun run build
