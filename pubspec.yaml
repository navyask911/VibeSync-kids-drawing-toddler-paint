name: kids_drawing_toddler_paint
description: "VibeSync Kids Drawing Toddler Paint with child-directed AdMob settings"
publish_to: "none"
version: 1.0.5+20261024

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  in_app_update: ^4.2.5
  internet_connection_checker_plus: ^3.1.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4

  # Google Mobile Ads official Flutter plugin
  google_mobile_ads: 9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Automatic Launcher Icons Generator for Android & iOS
  flutter_launcher_icons: ^0.13.1

# ==============================================================================
# FLUTTER LAUNCHER ICONS CONFIGURATION
# Generates mipmap-hdpi, xhdpi, xxhdpi, xxxhdpi, and Android 8.0+ adaptive icons
# Run: dart run flutter_launcher_icons
# ==============================================================================
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  # Assets can be enabled when asset files are added to the directory:
  # assets:
  #   - assets/icon/
